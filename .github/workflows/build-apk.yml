name: Build Android APK (Raidexs)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21 (Required for Capacitor 8 & Android Gradle Plugin 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx @capacitor/cli sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Copy & Rename APK for Easy Download
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/Raidexs-v1.0-debug.apk
          echo "APK generado exitosamente: build-artifacts/Raidexs-v1.0-debug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raidexs-Android-APK
          path: build-artifacts/Raidexs-v1.0-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: build-artifacts/Raidexs-v1.0-debug.apk
          tag_name: v1.0.0
          name: Raidexs Android APK v1.0.0
          body: |
            ## 📱 Descarga de la Aplicación Raidexs (APK Oficial)

            ¡Gracias por descargar Raidexs!

            ### 📥 Instrucciones de Instalación en Android:
            1. Descarga el archivo adjunto `Raidexs-v1.0-debug.apk` que aparece abajo en **Assets**.
            2. Si tu teléfono solicita permisos de instalación, selecciona **"Permitir desde esta fuente"** (Orígenes desconocidos).
            3. Abre el archivo descargado y presiona **"Instalar"**.
            4. ¡Listo! Disfruta de recargas rápidas, seguras y al mejor precio desde tu móvil.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
