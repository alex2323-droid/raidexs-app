name: Build Android APK (Raidexs)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21 (Required for Capacitor 8 & Android Gradle Plugin 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Assets to Android Platform
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo "Archivos web compilados correctamente en assets públicos de Android."
          npx --yes @capacitor/cli sync android --inline || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APKs with assembleRelease & assembleDebug
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon || ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Copy & Rename APKs for Distribution
        if: always()
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-artifacts/ \; 2>/dev/null || true
          FIRST_APK=$(find build-artifacts -name "*.apk" | head -n 1)
          if [ -n "$FIRST_APK" ]; then
            cp "$FIRST_APK" build-artifacts/Raidexs-v1.0.apk
            cp "$FIRST_APK" build-artifacts/Raidexs-v1.0-release.apk
          fi
          echo "Archivos APK generados:"
          ls -lh build-artifacts/

      - name: Create Release Notes
        if: always()
        run: |
          cat << 'NOTE_EOF' > release-notes.md
          ## 📱 Descarga de la Aplicación Raidexs (APK Oficial)

          ¡Bienvenido a Raidexs!

          ### 📥 Instrucciones de Instalación en tu Android:
          1. Descarga el archivo **Raidexs-v1.0.apk** en la sección de Assets más abajo.
          2. Si tu teléfono solicita confirmación, pulsa en **'Permitir desde esta fuente'**.
          3. Abre el archivo descargado y presiona **'Instalar'**.
          NOTE_EOF

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Raidexs-Android-APK
          path: build-artifacts/*.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f build-artifacts/Raidexs-v1.0.apk ]; then
            echo "No se encontró ningún APK para publicar en Release."
            exit 0
          fi
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 ya existe. Subiendo archivos APK a los Assets..."
            gh release upload v1.0.0 build-artifacts/*.apk --clobber
          else
            echo "Creando nueva Release v1.0.0..."
            gh release create v1.0.0 build-artifacts/*.apk \
              --title "Raidexs Android APK v1.0.0" \
              --notes-file release-notes.md \
              --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallback Release Action
        if: always()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: build-artifacts/*.apk
          tag_name: v1.0.0
          name: Raidexs Android APK v1.0.0
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
